cargo-features = ["codegen-backend"]

[workspace]
members = ["browser_manipulation", "browser_manipulation_*"]
default-members = ["browser_manipulation"]
resolver = "3"

[workspace.lints.clippy]
float_cmp = "allow"
len_zero = "allow"
undocumented_unsafe_blocks = "warn"
tabs_in_doc_comments = "allow"
doc_lazy_continuation = "allow"
get_first = "allow"
get_last_with_len = "allow"
manual_is_multiple_of = "allow"

[workspace.lints.rust]
unused_features = "allow"

[workspace.dependencies]
bon = "3.10"
crc32fast = "1.5"
derive_more = "2"
futures = "0.3"
jiff = "0.2"
miette = { version = "^7.6.0", features = ["fancy", "serde", "syntect-highlighter"] }
playwright-rs = "=0.19.0"
png = "0.18"
rand = "0.9"
serde = "1"
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = "1"
